[package]
name        = "polymarket-btc-arb-rust"
version     = "0.1.0"
edition     = "2021"
description = "Ultra low-latency Polymarket BTC arbitrage bot with real-time TUI dashboard"
license     = "MIT"

# ── Release: maximise throughput & minimise latency ────────────────────────
[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
panic            = "abort"
strip            = true
overflow-checks  = false

[profile.dev]
opt-level = 1

[dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "gzip", "brotli",
] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# TUI
ratatui   = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Precise money math
rust_decimal        = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Concurrency
dashmap     = "6"
parking_lot = "0.12"

# Cache
moka = { version = "0.12", features = ["future"] }

# Error handling
anyhow    = "1"
thiserror = "2"

# Polymarket official SDK — handles EIP-712 signing, HMAC L2 auth, CLOB + Gamma APIs
polymarket-client-sdk = { version = "0.4", features = ["clob", "gamma"] }

# Concrete signer type (re-used from SDK's dep tree — zero extra compilation)
alloy-signer-local = { version = "1", default-features = false }

# HTTP server (API for web frontend)
axum       = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Misc
rand       = "0.8"
uuid       = { version = "1", features = ["v4"] }
csv        = "1"
rusqlite   = { version = "0.32", features = ["bundled"] }
once_cell  = "1"
url        = "2"
